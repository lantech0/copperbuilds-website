extends: existence
message: "Avoid '%s' — off-brand agency jargon. Use plain, direct language instead."
link: ''
level: warning
ignorecase: true
tokens:
  - 'innovative solution(?:s)?'
  - 'cutting[- ]edge'
  - 'world[- ]class'
  - 'best[- ]in[- ]class'
  - 'industry[- ]leading'
  - 'state[- ]of[- ]the[- ]art'
  - 'next[- ]level'
  - 'game[- ]changer'
  - 'game changer'
  - 'synergy'
  - 'seamlessly'
  - 'robust'
  - 'scalable solution(?:s)?'
  - 'holistic approach'
  - 'leverage(?:d|s)? (?:our|your|the)'
  - 'we are passionate about'
  - 'we take pride in'
  - 'dedicated team'
  - 'results[- ]driven'
  - 'data[- ]driven (?!report|analysis|decision)'
  - 'best practices'
  - 'value[- ]add(?:ed)?'
  - 'paradigm'
  - 'disruptive'
  - 'at the end of the day'
  - 'moving forward'
  - 'going forward'
  - 'circle back'
  - 'touch base'
  - 'reach out to us'
  - 'don''t hesitate to'
  - 'feel free to'
  - 'please note that'
  - 'it is worth noting'
  - 'as you know'
  - 'transformative'
  - 'empower(?:ing)?'
  - 'elevate your'
  - 'take your .+ to the next level'
