<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="CopperBuilds logo">

  <!-- Outer decorative rings -->
  <circle cx="160" cy="160" r="130" fill="none" stroke="#B87333" stroke-width="2.5"/>
  <circle cx="160" cy="160" r="121" fill="none" stroke="#B87333" stroke-width="1"/>

  <!-- Diamond markers at 8 positions on outer ring -->
  <polygon points="160,26 164,30 160,34 156,30" fill="#B87333"/>
  <polygon points="248,64 252,68 248,72 244,68" fill="#B87333"/>
  <polygon points="286,156 290,160 286,164 282,160" fill="#B87333"/>
  <polygon points="248,248 252,252 248,256 244,252" fill="#B87333"/>
  <polygon points="160,286 164,290 160,294 156,290" fill="#B87333"/>
  <polygon points="72,248 76,252 72,256 68,252" fill="#B87333"/>
  <polygon points="30,156 34,160 30,164 26,160" fill="#B87333"/>
  <polygon points="72,64 76,68 72,72 68,68" fill="#B87333"/>

  <!-- Leaf sprigs at top -->
  <path d="M 148,90 C 140,78 124,80 128,90 C 130,95 146,93 148,90 Z" fill="#B87333"/>
  <path d="M 147,93 C 138,87 126,92 130,99 C 132,103 147,93 147,93 Z" fill="#B87333"/>
  <line x1="148" y1="90" x2="152" y2="100" stroke="#B87333" stroke-width="1.5"/>
  <path d="M 172,90 C 180,78 196,80 192,90 C 190,95 174,93 172,90 Z" fill="#B87333"/>
  <path d="M 173,93 C 182,87 194,92 190,99 C 188,103 173,93 173,93 Z" fill="#B87333"/>
  <line x1="172" y1="90" x2="168" y2="100" stroke="#B87333" stroke-width="1.5"/>
  <line x1="152" y1="100" x2="168" y2="100" stroke="#B87333" stroke-width="1"/>

  <!-- Chimney -->
  <rect x="144" y="94" width="10" height="18" fill="#B87333"/>

  <!-- Roof -->
  <polygon points="160,104 205,140 115,140" fill="#B87333"/>

  <!-- House body -->
  <rect x="118" y="140" width="84" height="70" fill="#B87333"/>

  <!-- Windows (white cutouts) -->
  <rect x="127" y="150" width="20" height="17" fill="#FAFAF7"/>
  <rect x="173" y="150" width="20" height="17" fill="#FAFAF7"/>

  <!-- Door (white cutout) -->
  <rect x="148" y="172" width="24" height="38" fill="#FAFAF7"/>

  <!-- Circuit traces LEFT -->
  <path d="M 117,154 H 80 V 170" fill="none" stroke="#B87333" stroke-width="2"/>
  <circle cx="80" cy="170" r="4" fill="#B87333"/>
  <path d="M 117,166 H 64 V 182" fill="none" stroke="#B87333" stroke-width="2"/>
  <circle cx="64" cy="182" r="4" fill="#B87333"/>
  <path d="M 117,178 H 76 V 194" fill="none" stroke="#B87333" stroke-width="2"/>
  <circle cx="76" cy="194" r="4" fill="#B87333"/>

  <!-- Circuit traces RIGHT -->
  <path d="M 203,154 H 240 V 170" fill="none" stroke="#B87333" stroke-width="2"/>
  <circle cx="240" cy="170" r="4" fill="#B87333"/>
  <path d="M 203,166 H 256 V 182" fill="none" stroke="#B87333" stroke-width="2"/>
  <circle cx="256" cy="182" r="4" fill="#B87333"/>
  <path d="M 203,178 H 244 V 194" fill="none" stroke="#B87333" stroke-width="2"/>
  <circle cx="244" cy="194" r="4" fill="#B87333"/>

  <!-- Ribbon banner body -->
  <path d="M 60,207 H 260 L 276,218 L 260,229 H 60 L 44,218 Z" fill="#B87333"/>
  <!-- Ribbon end folds (darker) -->
  <path d="M 44,218 L 60,207 L 60,229 Z" fill="#7A5020"/>
  <path d="M 276,218 L 260,207 L 260,229 Z" fill="#7A5020"/>
  <!-- Banner text -->
  <text x="160" y="223" text-anchor="middle"
        font-family="'DM Sans',Arial,sans-serif" font-size="11.5" font-weight="700"
        letter-spacing="0.18em" fill="#FAFAF7">WEB SOLUTIONS</text>

  <!-- Bottom badge ornament -->
  <line x1="118" y1="283" x2="148" y2="283" stroke="#B87333" stroke-width="1.5"/>
  <circle cx="160" cy="283" r="3" fill="#B87333"/>
  <line x1="172" y1="283" x2="202" y2="283" stroke="#B87333" stroke-width="1.5"/>

  <!-- COPPERBUILDS wordmark -->
  <text x="160" y="342" text-anchor="middle"
        font-family="Calistoga,Georgia,serif" font-size="33" font-weight="400"
        fill="#B87333" letter-spacing="0.04em">COPPERBUILDS</text>

  <!-- Divider with diamond center -->
  <line x1="64" y1="355" x2="150" y2="355" stroke="#B87333" stroke-width="1"/>
  <polygon points="160,351 164,355 160,359 156,355" fill="#B87333"/>
  <line x1="170" y1="355" x2="256" y2="355" stroke="#B87333" stroke-width="1"/>

  <!-- BUILT FOR THE TRADES tagline -->
  <text x="160" y="378" text-anchor="middle"
        font-family="'DM Sans',Arial,sans-serif" font-size="9.5" font-weight="700"
        letter-spacing="0.22em" fill="#B87333">BUILT FOR THE TRADES</text>

</svg>
