<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <link rel="stylesheet" href="/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }

  .illus {
    display: inline-flex;
    background: transparent;
  }
</style>
</head>
<body>

<!-- FLAT-RATE PRICING -->
<div class="illus" id="flat-rate">
  <svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="80" cy="80" r="72" fill="rgba(184,115,51,0.08)"/>
    <path d="M52 44 L108 44 L130 66 L130 116 L80 148 L30 116 L30 66 Z"
      fill="#FFFFFF" stroke="#B87333" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="80" cy="64" r="7" fill="#FAFAF7" stroke="#B87333" stroke-width="2"/>
    <text x="80" y="118" text-anchor="middle"
      font-family="'Calistoga', serif" font-size="44" fill="#B87333">$</text>
  </svg>
</div>

<!-- NO CONTRACTS -->
<div class="illus" id="no-contracts">
  <svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="80" cy="80" r="72" fill="rgba(184,115,51,0.08)"/>
    <rect x="38" y="28" width="72" height="92" rx="7" fill="#FFFFFF" stroke="#E7E0D8" stroke-width="2"/>
    <path d="M94 28 L110 44 L94 44 Z" fill="#F5F0EA" stroke="#E7E0D8" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="52" y1="64" x2="96" y2="64" stroke="#E7E0D8" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="78" x2="96" y2="78" stroke="#E7E0D8" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="92" x2="78" y2="92" stroke="#E7E0D8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="104" cy="112" r="24" fill="#B87333"/>
    <polyline points="93,112 101,120 115,105" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<!-- 48-HOUR DELIVERY -->
<div class="illus" id="delivery">
  <svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="80" cy="80" r="72" fill="rgba(184,115,51,0.08)"/>
    <circle cx="80" cy="76" r="50" fill="#FFFFFF" stroke="#E7E0D8" stroke-width="2.5"/>
    <line x1="80" y1="30" x2="80" y2="38" stroke="#A8A29E" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="114" x2="80" y2="122" stroke="#A8A29E" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="76" x2="42" y2="76" stroke="#A8A29E" stroke-width="2" stroke-linecap="round"/>
    <line x1="118" y1="76" x2="126" y2="76" stroke="#A8A29E" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="76" x2="100" y2="62" stroke="#1C1917" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="80" y1="76" x2="80" y2="52" stroke="#A8A29E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="76" r="5" fill="#B87333"/>
    <rect x="46" y="90" width="68" height="26" rx="13" fill="#B87333"/>
    <text x="80" y="108" text-anchor="middle"
      font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#FFFFFF" letter-spacing="0.06em">48 HRS</text>
  </svg>
</div>

</body>
</html>
