<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FAFAF7; font-family: 'DM Sans', sans-serif; padding: 56px; display: flex; flex-direction: column; gap: 56px; }

  .label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #78716C; margin-bottom: 18px;
  }

  .logo { display: inline-flex; align-items: baseline; line-height: 1; }

  .copper {
    font-family: 'Calistoga', Georgia, serif;
    color: #B87333;
    letter-spacing: -0.01em;
  }
  .builds {
    font-family: 'DM Sans', Arial, sans-serif;
    font-weight: 700;
    color: #4E9F7D;
    letter-spacing: -0.03em;
  }

  .slab { padding: 32px 40px; border-radius: 12px; display: inline-block; }
  .light { border: 1px solid #E7E0D8; background: #FAFAF7; }
  .dark  { background: #1C1917; }

  .dark .copper { color: #B87333; }
  .dark .builds { color: #4E9F7D; }
</style>
</head>
<body>

<!-- ═══ PRIMARY — LIGHT ═══════════════════════════ -->
<div>
  <div class="label">Primary — Light</div>
  <div class="slab light">
    <div class="logo">
      <span class="copper" style="font-size:28px">Copper</span><span class="builds" style="font-size:28px">Builds</span>
    </div>
  </div>
</div>

<!-- ═══ REVERSED — DARK ════════════════════════════ -->
<div>
  <div class="label">Reversed — Dark Background</div>
  <div class="slab dark">
    <div class="logo dark">
      <span class="copper" style="font-size:28px">Copper</span><span class="builds" style="font-size:28px">Builds</span>
    </div>
  </div>
</div>

<!-- ═══ LOCKUP — SIZES ════════════════════════════ -->
<div>
  <div class="label">Lockup — Sizes</div>
  <div style="display:flex;flex-direction:column;gap:24px;align-items:flex-start;">

    <!-- Nav (18px) -->
    <div class="logo">
      <span class="copper" style="font-size:18px">Copper</span><span class="builds" style="font-size:18px">Builds</span>
    </div>

    <!-- Standard (28px) -->
    <div class="logo">
      <span class="copper" style="font-size:28px">Copper</span><span class="builds" style="font-size:28px">Builds</span>
    </div>

    <!-- Hero (42px) -->
    <div class="logo">
      <span class="copper" style="font-size:42px">Copper</span><span class="builds" style="font-size:42px">Builds</span>
    </div>

  </div>
</div>

</body>
</html>
