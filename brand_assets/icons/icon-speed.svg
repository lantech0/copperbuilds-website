<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Clock outer ring -->
  <circle cx="12" cy="12" r="9.25" stroke="#1C1917" stroke-width="1.75"/>
  <!-- Clock tick marks -->
  <path d="M12 3.5V5" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M12 19v1.5" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M3.5 12H5" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M19 12h1.5" stroke="#1C1917" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour hand (short, pointing up-left) -->
  <path d="M12 12L9 8.5" stroke="#1C1917" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Minute hand (orange, pointing up-right fast) -->
  <path d="M12 12L15.5 7" stroke="#E8600A" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="12" cy="12" r="1.25" fill="#1C1917"/>
</svg>
